[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nocte"
version = "1.0.0.dev0"
description = "Analysis of neuronal oscillations, cycles and time events in electrophysiological recordings"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.65",
    "numba>=0.59",
    "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["C408"]